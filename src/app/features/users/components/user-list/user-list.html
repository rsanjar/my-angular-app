<div class="container-fluid">
  <div class="container-xl my-5">
    <div class="row">
      <div class="col-3">
        <ul id="users">
          @for (user of users(); track user.id) {
            <li>
              <app-user
                [user]="user"
                [selected]="isSelectedUser(user)"
                (userSelected)="onUserSelected($event)"
              ></app-user>
            </li>
          }
        </ul>
      </div>
      <div class="col-9">
        @if (selectedUser() !== null) {
          <app-user-details [currentUser]="selectedUser()"></app-user-details>
          <app-user-tasks [userID]="selectedUser()?.id"></app-user-tasks>
        } @else {
          <div class="alert alert-info" role="alert">
            Please select a user to view details and tasks.
          </div>
        }
      </div>
    </div>
  </div>
</div>
