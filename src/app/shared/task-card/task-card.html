@if (task(); as task) {
  <div class="card my-3" [ngClass]="task.isCompleted ? 'bg-info text-dark' : 'bg-dark text-light'">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <h5 class="card-title mb-2">{{ task.title | titlecase }}</h5>
        <p class="card-text mb-2">{{ task.description | truncate: 50 : '...' }}</p>

        <div class="text-light-emphasis">
          @if (task.isCompleted) {
            <small>Completed On: {{ task.completedDate | taskDate }}</small>
          } @else {
            <small>Due Date: {{ task.dueDate | taskDate }}</small>
          }
        </div>
      </div>
      <ng-content />
    </div>
  </div>
}
